[package]
name = "jev-tree"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
authors = ["lee-lou2 <lee@lou2.kr>"]
description = "Hierarchical knowledge service: Jev-driven tree descent over SQLite"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lee-lou2/jev-tree"

[dependencies]
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
async-stream = "0.3"
futures-core = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["fs", "trace", "catch-panic"] }
thiserror = "2"
regex = "1"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", features = ["password-hash"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Golden-set evaluation runner. Not part of the server binary; see eval/README.md.
[[example]]
name = "eval"
path = "eval/runner/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
